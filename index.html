<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANUEL // v3.0</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0f;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    .terminal {
      border: 1px solid #333;
      border-radius: 12px;
      padding: 50px 30px;
      background: #121214;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .small {
      color: #777;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 80px);
      letter-spacing: 8px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .version {
      color: #999;
      font-family: monospace;
      font-size: 16px;
      margin-bottom: 45px;
    }

    .date {
      font-family: monospace;
      color: #ccc;
      margin-bottom: 35px;
    }

    .loading {
      color: #666;
      font-family: monospace;
      margin-bottom: 30px;
    }

    .enter {
      display: inline-block;
      padding: 14px 35px;
      border: 1px solid #555;
      border-radius: 6px;
      color: white;
      text-decoration: none;
      font-family: monospace;
      transition: all 0.3s ease;
    }

    .enter:hover {
      background: white;
      color: #0d0d0f;
      border-color: white;
    }

    .footer {
      margin-top: 25px;
      color: #444;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="terminal">

      <div class="small">PERSONAL ARCHIVE</div>

      <h1>MANUEL</h1>

      <div class="version">
        LIFE_OS // VERSION 3.0
      </div>

      <div class="date">
        15.08.1996 — 15.08.2026
      </div>

      <div class="loading">
        &gt; 30 years of memories loaded.
      </div>

      <a href="#" class="enter" onclick="alert('Coming soon... ❤️'); return false;">
        [ ENTER ]
      </a>

    </div>

    <div class="footer">
      SYSTEM STATUS: READY
    </div>

  </div>

</body>
</html>
