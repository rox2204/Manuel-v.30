<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANUEL // v.30</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.42),
          rgba(0, 0, 0, 0.42)
        ),
        url("0c6f8196-545b-4701-9db4-83c7b19c2494.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .terminal {
      padding: 55px 40px;

      background: rgba(0, 0, 0, 0.62);

      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 16px;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: clamp(50px, 12vw, 85px);
      font-weight: 400;
      letter-spacing: 10px;
      margin-bottom: 12px;
    }

    .version {
      color: rgba(255, 255, 255, 0.65);
      font-family: monospace;
      font-size: 17px;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    .date {
      color: rgba(255, 255, 255, 0.75);
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 42px;
    }

    .access {
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
      text-align: left;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.60);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 20px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 7px;

      color: #fff;
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.12);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.30);
    }

    .enter {
      width: 100%;
      padding: 14px;
      margin-top: 5px;

      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;

      color: #fff;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 2px;

      cursor: pointer;
      transition: all 0.3s ease;
    }

    .enter:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .message {
      min-height: 18px;
      margin-top: 15px;

      color: rgba(255, 255, 255, 0.65);
      font-family: monospace;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .terminal {
        padding: 40px 25px;
      }

      h1 {
        letter-spacing: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="terminal">

      <h1>MANUEL</h1>

      <div class="version">
        v.30
      </div>

      <div class="date">
        15.08.1996 — 15.08.2026
      </div>

      <div class="access">

        <label for="name">
          ENTER YOUR NAME
        </label>

        <input
          type="text"
          id="name"
          placeholder="your name..."
        >

        <label for="code">
          ACCESS CODE
        </label>

        <input
          type="password"
          id="code"
          placeholder="••••••••"
        >

        <button class="enter" onclick="enterSite()">
          [ ENTER ]
        </button>

        <div class="message" id="message"></div>

      </div>

    </div>

  </div>

  <script>
    function enterSite() {

      const name = document.getElementById("name").value;
      const code = document.getElementById("code").value;
      const message = document.getElementById("message");

      if (name.trim() === "" || code.trim() === "") {
        message.textContent = "> Please complete all fields.";
        return;
      }

      message.textContent = "> Access granted. Welcome.";
    }
  </script>

</body>
</html>
