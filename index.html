<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANUEL // v3.0</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background-image:
        linear-gradient(rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.48)),
        url("def71b1c-21f0-4749-a8be-adaf8b333e83.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .terminal {
      padding: 55px 40px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;

      /* Negro transparente */
      background: rgba(0, 0, 0, 0.68);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);
    }

    .small {
      color: rgba(255, 255, 255, 0.55);
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(48px, 12vw, 86px);
      letter-spacing: 10px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .version {
      color: rgba(255, 255, 255, 0.65);
      font-family: monospace;
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .date {
      color: rgba(255, 255, 255, 0.8);
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 38px;
    }

    .access {
      text-align: left;
      max-width: 360px;
      margin: 0 auto;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.55);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 20px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 7px;

      color: white;
      font-family: monospace;
      font-size: 14px;

      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.12);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .enter {
      width: 100%;
      padding: 14px;

      margin-top: 5px;

      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;

      color: white;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 2px;

      cursor: pointer;
      transition: all 0.3s ease;
    }

    .enter:hover {
      background: white;
      color: black;
      border-color: white;
    }

    .message {
      min-height: 20px;
      margin-top: 18px;

      color: rgba(255, 255, 255, 0.65);
      font-family: monospace;
      font-size: 11px;
    }

    .footer {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.35);
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .terminal {
        padding: 40px 25px;
      }

      h1 {
        letter-spacing: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="terminal">

      <div class="small">
        PERSONAL ARCHIVE
      </div>

      <h1>MANUEL</h1>

      <div class="version">
        LIFE_OS // VERSION 3.0
      </div>

      <div class="date">
        15.08.1996 — 15.08.2026
      </div>

      <div class="access">

        <label for="name">
          ENTER YOUR NAME
        </label>

        <input
          type="text"
          id="name"
          placeholder="your name..."
        >

        <label for="code">
          ACCESS CODE
        </label>

        <input
          type="password"
          id="code"
          placeholder="••••••••"
        >

        <button class="enter" onclick="enterSite()">
          [ ENTER ]
        </button>

        <div class="message" id="message"></div>

      </div>

    </div>

    <div class="footer">
      SYSTEM STATUS: READY
    </div>

  </div>

  <script>
    function enterSite() {

      const name = document.getElementById("name").value;
      const code = document.getElementById("code").value;
      const message = document.getElementById("message");

      if (name.trim() === "" || code.trim() === "") {
        message.textContent = "> Please complete all fields.";
        return;
      }

      message.textContent = "> Access granted. Welcome.";

      // Más adelante conectaremos este botón
      // con la página principal de Manuel.
    }
  </script>

</body>
</html>
